<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Audit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>Web Audit</h1>
      <button id="settings-btn" class="icon-btn" title="Settings">&#9881;</button>
    </div>

    <div class="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Checking...</span>
      <span id="ws-status" style="margin-left: auto; font-size: 11px; color: #888;"></span>
    </div>

    <div style="text-align:center; padding: 16px 0;">
      <p style="color:#555; margin-bottom:12px;">
        Open the chat UI to start auditing websites.
      </p>
      <button id="open-chat-btn" class="btn btn-primary" style="width:100%;">
        Open Audit Chat
      </button>
    </div>

    <div style="padding: 0 0 16px 0; border-top: 1px solid #eee; padding-top: 16px;">
      <p style="font-size:11px; color:#888; margin-bottom:8px;">
        Pairing happens automatically when you open the chat page. Only use this
        if the status above doesn't say "paired" after opening it.
      </p>
      <label for="pair-code" style="display:block; font-size:12px; color:#555; margin-bottom:4px;">
        Manual pairing code (copy from the chat UI)
      </label>
      <input type="text" id="pair-code" placeholder="e.g. ui_a1b2c3d4"
             style="width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:4px; font-size:13px; margin-bottom:8px;" />
      <button id="pair-btn" class="btn btn-primary" style="width:100%;">Pair with this session</button>
      <div id="pair-status" style="font-size:12px; margin-top:6px; min-height:16px;"></div>
    </div>

    <div class="footer">
      <button id="reconnect-btn" class="btn btn-link">Reconnect</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
