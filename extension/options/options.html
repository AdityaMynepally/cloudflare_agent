<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudFlare Site Auditor - Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #1a1a2e;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      color: #555;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .field input:focus {
      outline: none;
      border-color: #4a90d9;
    }
    .field .hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-primary {
      background: #4a90d9;
      color: white;
    }
    .btn-primary:hover {
      background: #357abd;
    }
    #save-status {
      margin-left: 12px;
      font-size: 13px;
      color: #28a745;
    }
    .actions {
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CloudFlare Site Auditor Settings</h1>

    <div class="field">
      <label for="backend-url">Backend URL</label>
      <input type="url" id="backend-url" placeholder="https://your-app.azurecontainerapps.io" />
      <div class="hint">The URL of your Azure Container App (FastAPI port, typically :8000)</div>
    </div>

    <div class="field">
      <label for="api-key">API Key</label>
      <input type="password" id="api-key" placeholder="Enter API key (optional)" />
      <div class="hint">Provided by admin. Leave blank if not required.</div>
    </div>

    <div class="actions">
      <button id="save-btn" class="btn btn-primary">Save</button>
      <span id="save-status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
